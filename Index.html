<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title><?= businessName ?></title>
  <script>
    // Apply the saved theme and menu width before anything paints (no flash).
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('mohamyPlus.theme') || 'auto'; } catch (e) { pref = 'auto'; }
      var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme-pref', pref);
      var collapsed = false;
      try { collapsed = localStorage.getItem('mohamyPlus.nav') === 'collapsed'; } catch (e) { collapsed = false; }
      if (collapsed) document.documentElement.setAttribute('data-nav', 'collapsed');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@600;700&display=swap">
  <?!= mpInclude_('Styles'); ?>
</head>
