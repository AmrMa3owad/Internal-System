  var SVG_NS = 'http://www.w3.org/2000/svg';

  // ------------------------------------------------------------ Language
  function t(key, params) {
    var text = (I.ui[state.lang] && I.ui[state.lang][key]) || I.ui.en[key] || key;
    Object.keys(params || {}).forEach(function (name) { text = text.split('{' + name + '}').join(String(params[name])); });
    return text;
  }
  function lower(text) { return state.lang === 'en' ? String(text).toLowerCase() : String(text); }
  function entityTitle(entity) { return (I.entities[state.lang][entity] || I.entities.en[entity])[0]; }
  function entitySingular(entity) { return (I.entities[state.lang][entity] || I.entities.en[entity])[1]; }
  function humanize(value) {
    var text = String(value).replace(/_/g, ' ').toLowerCase();
    return text.charAt(0).toUpperCase() + text.slice(1);
  }
  function enumLabel(value) {
    var map = I.enums[state.lang] || {};
    return map[value] || (state.lang === 'en' && I.enums.en[value]) || humanize(value);
  }
  function fieldLabel(field) {
    var local = I.fields[state.lang] || {};
    if (local[field]) return local[field];
    if (I.fields.en[field]) return I.fields.en[field];
    var spaced = field.replace(/ID$/, '').replace(/([a-z])([A-Z])/g, '$1 $2');
    return spaced.charAt(0).toUpperCase() + spaced.slice(1).toLowerCase();
  }
  function settingLabel(key) { return (I.settings[state.lang] || {})[key] || I.settings.en[key] || humanize(key); }
  function translateError(message) {
    if (state.lang !== 'ar' || !message) return message;
    for (var i = 0; i < I.errors.length; i += 1) {
      var match = String(message).match(I.errors[i][0]);

    return message;
  }
  function errorMessage(error) { return translateError(error && error.message) || t('somethingWrong'); }
  function locale() { return state.lang === 'ar' ? 'ar-EG-u-nu-latn' : 'en-GB'; }

  // ------------------------------------------------------------ Helpers
  function call(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(function (response) {
          if (response && response.ok) resolve(response.data);
          else reject(response && response.error ? response.error : { message: 'Unexpected server response.' });
        })
        .withFailureHandler(function (error) { reject({ message: (error && error.message) || String(error) }); });
      runner[name].apply(runner, args);
    });
  }

  function append(el, child) {
    if (child === null || child === undefined || child === false) return;
    if (Array.isArray(child)) { child.forEach(function (c) { append(el, c); }); return; }
    el.appendChild(child instanceof Node ? child : document.createTextNode(String(child)));
  }

  /** Element builder. Text is always set via text nodes, never parsed as HTML. */
  function h(tag, props) {
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (key) {
      var value = props[key];
      if (value === null || value === undefined || value === false) return;
      if (key === 'class') el.className = value;
      else if (key === 'text') el.textContent = value;
      else if (key.indexOf('on') === 0 && typeof value === 'function') el.addEventListener(key.slice(2), value);
      else if (key === 'value') el.value = value;
      else if (key === 'checked' || key === 'disabled' || key === 'selected' || key === 'required' || key === 'hidden') el[key] = !!value;
      else el.setAttribute(key, value === true ? '' : String(value));
    });
    for (var i = 2; i < arguments.length; i += 1) append(el, arguments[i]);
    return el;
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
  function $(id) { return document.getElementById(id); }
  function blank(value) { return value === null || value === undefined || String(value).trim() === ''; }
  function tone(value) {
    var keys = Object.keys(TONES);
    for (var i = 0; i < keys.length; i += 1) if (TONES[keys[i]].indexOf(value) !== -1) return keys[i];
    return 'neutral';
  }
  function pill(value, plain) { return h('span', { class: 'pill ' + tone(value) + (plain ? ' plain' : ''), text: enumLabel(value) }); }
  function money(value) {
    var currency = (state.boot && state.boot.business.currency) || 'EGP';
    var number = Number(value || 0);
    try { return new Intl.NumberFormat(state.lang === 'ar' ? 'ar-EG-u-nu-latn' : 'en-EG', { style: 'currency', currency: currency, maximumFractionDigits: 0 }).format(number); }
    catch (e) { return currency + ' ' + number.toFixed(0); }
  }
  function cairoToday() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Africa/Cairo' }).format(new Date()); }
  function cairoHour() { return Number(new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Cairo', hour: 'numeric', hour12: false }).format(new Date())); }
  function dayNumber(iso) { var p = String(iso).slice(0, 10).split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000; }
  function dayDiff(iso) { return blank(iso) ? null : Math.round(dayNumber(iso) - dayNumber(state.today)); }
  function timeOf(iso) { var text = String(iso || ''); return text.length >= 16 && text.slice(11, 16) !== '00:00' ? text.slice(11, 16) : ''; }
  function shortDate(iso) {
    var p = String(iso).slice(0, 10).split('-');
    var date = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], 12));
    var opts = { day: 'numeric', month: 'short', timeZone: 'UTC' };
    if (p[0] !== state.today.slice(0, 4)) opts.year = 'numeric';
    try { return new Intl.DateTimeFormat(locale(), opts).format(date); } catch (e) { return String(iso).slice(0, 10); }
  }
  /** "Today", "Tomorrow", "In 3 days", "12 Mar" … plus the time when there is one. */
  function friendlyDate(iso, withTime) {
    if (blank(iso)) return '';
    var n = dayDiff(iso);
    var text = n === 0 ? t('today') : n === 1 ? t('tomorrow') : n === -1 ? t('yesterday') : (n > 1 && n < 7) ? t('inDays', { n: n }) : shortDate(iso);
    var time = withTime ? timeOf(iso) : '';
    return time ? text + ' · ' + time : text;
  }
  /** Due-date chip: overdue tasks turn red, today amber, tomorrow blue. */
  function dueChip(iso, withTime) {
    if (blank(iso)) return null;
    var n = dayDiff(iso);
    if (n < 0) return h('span', { class: 'pill danger plain', text: t('overdueDays', { n: -n }) });
    return h('span', { class: 'pill plain ' + (n === 0 ? 'warn' : n === 1 ? 'info' : 'neutral'), dir: 'auto', text: friendlyDate(iso, withTime) });
  }
  function initials(name) {
    var words = String(name || '?').trim().split(/\s+/).filter(Boolean);
    return ((words[0] || '?').charAt(0) + (words.length > 1 ? words[words.length - 1].charAt(0) : '')).toUpperCase();
  }
  function avatar(name, size) {
    var sum = 0; String(name || '').split('').forEach(function (ch) { sum += ch.charCodeAt(0); });
    return h('span', { class: 'avatar a' + (sum % 6) + (size ? ' ' + size : ''), text: initials(name), title: name || '' });
  }
  function person(id, labels) {
    var name = (labels && labels[id]) || userName(id);
    if (!name) return h('span', { class: 'faint', text: '—' });
    return h('span', { class: 'person' }, avatar(name, 'sm'), h('span', { dir: 'auto', text: name }));
  }
  function waLink(phone) {
    var digits = String(phone || '').replace(/\D/g, '');
    if (digits.indexOf('00') === 0) digits = digits.slice(2);
    if (digits.length === 11 && digits.charAt(0) === '0') digits = '20' + digits.slice(1);
    return 'https://wa.me/' + digits;
  }

  function can(entity, action) {
    var perms = state.boot && state.boot.permissions[entity];
    return !!perms && perms.indexOf(action) !== -1;
  }
  function isSenior() { return state.boot && (state.boot.role === 'OWNER' || state.boot.role === 'PARTNER'); }
  function canAssign(entity) { return state.boot.assignable.indexOf(entity) !== -1 && can('Assignments', 'create') && can(entity, 'update'); }
  function formMeta(entity) { return state.boot.forms[entity]; }
  function fieldMeta(entity, field) {
    var meta = formMeta(entity);
    if (!meta) return null;
    for (var i = 0; i < meta.fields.length; i += 1) if (meta.fields[i].name === field) return meta.fields[i];
    return null;
  }
  function isHiddenField(entity, field) { var meta = formMeta(entity); return !!meta && meta.hiddenFields.indexOf(field) !== -1; }
  function refTarget(entity, field, record) {
    if (entity === 'Documents' && field === 'EntityID') return DOC_TARGETS[record.EntityType];
    var meta = fieldMeta(entity, field);
    if (meta && meta.ref) return meta.ref;
    return { ConvertedClientID: 'Clients', CreatedFromLeadID: 'Leads', RecordedBy: 'Users', UploadedBy: 'Users', AssignedTo: 'Users', AssignedLawyer: 'Users' }[field] || null;
  }
  function recordId(entity, record) { return record[formMeta(entity).idField]; }
  function recordLabel(entity, record) {
    if (entity === 'Consultations') return t('consultationOn', { d: friendlyDate(record.ConsultationDate, true) });
    if (entity === 'Transactions') return enumLabel(record.Type || '') + ' · ' + money(record.Amount);
    return record[formMeta(entity).labelField] || recordId(entity, record);
  }
  function userName(id) {
    var users = (state.boot && state.boot.users) || [];
    for (var i = 0; i < users.length; i += 1) if (users[i].UserID === id) return users[i].FullName;
    return null;
  }
  function detailLink(entity, id, label, className) {
    return h('a', { class: className || null, dir: 'auto', onclick: function (event) { event.stopPropagation(); navigate({ view: 'detail', entity: entity, id: id }); } }, label || id);
  }
  /** Plain text for compact lines (list subtitles, feed context). */
  function fieldText(entity, field, record, labels) {
    var value = record[field];
    if (blank(value)) return '';
    var target = refTarget(entity, field, record);
    if (target) return (labels && labels[value]) || (target === 'Users' && userName(value)) || '';
    if (MONEY_FIELDS.indexOf(field) !== -1) return money(value);
    if (DATE_FIELDS.indexOf(field) !== -1 || DATETIME_FIELDS.indexOf(field) !== -1) return friendlyDate(value, DATETIME_FIELDS.indexOf(field) !== -1);
    if (PILL_FIELDS.indexOf(field) !== -1) return enumLabel(value);
    return String(value);
  }
  function subParts(entity, record, labels) {
    return (ENTITY_UI[entity].sub || []).filter(function (field) { return !isHiddenField(entity, field); })
      .map(function (field) { return fieldText(entity, field, record, labels); }).filter(Boolean);
  }
  function subLine(entity, record, labels) { return subParts(entity, record, labels).join(' · '); }
  /** Each piece is isolated so phone numbers and names keep their own direction in either language. */
  function joinParts(parts) { return parts.filter(Boolean).map(function (part, i) { return [i ? ' · ' : '', h('bdi', { text: part })]; }); }
  /** Rich value for detail facts and list cells. */
  function formatValue(entity, field, record, labels) {
    var value = record[field];
    if (blank(value) && value !== 0) return h('span', { class: 'faint', text: '—' });
    var target = refTarget(entity, field, record);
    if (target === 'Users') return person(value, labels);
    if (target) {
      var label = labels && labels[value];
      if (!label || !can(target, 'read')) return h('span', { dir: 'auto', text: label || '—' });
      return detailLink(target, value, label);
    }
    if (MONEY_FIELDS.indexOf(field) !== -1) return h('span', { text: money(value) });
    if (field === 'DueDate' || field === 'Deadline' || field === 'NextFollowUpAt') return dueChip(value, field === 'NextFollowUpAt');
    if (DATE_FIELDS.indexOf(field) !== -1 || DATETIME_FIELDS.indexOf(field) !== -1) return h('span', { dir: 'auto', text: friendlyDate(value, DATETIME_FIELDS.indexOf(field) !== -1) });
    if (value === true || value === false) return value ? t('yes') : t('no');
    if (field === 'Phone') return h('a', { href: 'tel:' + String(value).replace(/\s/g, ''), dir: 'ltr', onclick: function (event) { event.stopPropagation(); } }, String(value));
    if (field === 'Email') return h('a', { href: 'mailto:' + value, onclick: function (event) { event.stopPropagation(); } }, String(value));
    var meta = fieldMeta(entity, field);
    if ((meta && meta.type === 'enum') || PILL_FIELDS.indexOf(field) !== -1) return pill(value);

  // ------------------------------------------------------------ Global search
  function setupSearch() {
    var input = $('global-search');
    var box = $('search-results');
    var timer = null;
    var seq = 0;
    var items = [];
    var active = -1;
    $('search-icon').appendChild(icon('search'));
    function highlight(index) {
      active = index;
      items.forEach(function (item, i) { item.el.classList.toggle('active', i === index); });
    }
    function open(item) { box.hidden = true; input.value = ''; input.blur(); navigate({ view: 'detail', entity: item.entity, id: item.id }); }
    function run() {
      var query = input.value.trim();
      if (query.length < 2) { box.hidden = true; return; }
      var mine = ++seq;
      call('apiSearch', query).then(function (result) {
        if (mine !== seq) return;
        clear(box);
        items = [];
        active = -1;
        if (!result.groups.length) { box.appendChild(h('div', { class: 'search-empty', text: t('noResultsFor', { q: query }) })); box.hidden = false; return; }
        result.groups.forEach(function (group) {
          box.appendChild(h('div', { class: 'search-group', text: entityTitle(group.entity) }));
          group.records.forEach(function (record) {
            var item = { entity: group.entity, id: recordId(group.entity, record) };
            var name = recordLabel(group.entity, record);
            item.el = h('button', { class: 'search-item', type: 'button', onclick: function () { open(item); } },
              ENTITY_UI[group.entity].title === 'FullName' ? avatar(name, 'sm') : h('span', { class: 'tile-icon', style: 'width:28px;height:28px;border-radius:8px' }, icon(ENTITY_UI[group.entity].icon)),
              h('span', { style: 'min-width:0' }, h('div', { dir: 'auto', style: 'font-weight:500', text: name }), h('div', { class: 'muted', style: 'font-size:12.5px' }, joinParts(subParts(group.entity, record, group.labels)))));
            items.push(item);
            box.appendChild(item.el);
          });
        });
        box.hidden = false;
        highlight(0);
      }).catch(function (error) { clear(box).appendChild(h('div', { class: 'search-empty', text: errorMessage(error) })); box.hidden = false; });
    }
    input.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(run, 220); });
    input.addEventListener('focus', function () { if (items.length && input.value.trim().length >= 2) box.hidden = false; });
    input.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowDown') { event.preventDefault(); highlight(Math.min(items.length - 1, active + 1)); }
      else if (event.key === 'ArrowUp') { event.preventDefault(); highlight(Math.max(0, active - 1)); }
      else if (event.key === 'Enter' && items[active]) { event.preventDefault(); open(items[active]); }
      else if (event.key === 'Escape') { box.hidden = true; input.blur(); }
    });
    document.addEventListener('click', function (event) { if (!$('search').contains(event.target)) box.hidden = true; });
    document.addEventListener('keydown', function (event) {
      if ((event.ctrlKey || event.metaKey) && String(event.key).toLowerCase() === 'k') { event.preventDefault(); input.focus(); input.select(); }
    });
  }

  function comparable(field, value) {
    if (blank(value)) return '';
    if (field.type === 'date') return String(value).slice(0, 10);
    if (field.type === 'datetime') return String(value).slice(0, 16);
    if (field.type === 'number') return String(Number(value));
    return String(value);
  }

  function duplicateAlert(error, onConfirm) {
    var list = (error.duplicates || []).map(function (match) {
      return h('li', { dir: 'auto', text: match.hidden ? t('dupHidden') : [match.fullName, match.phone, match.email].filter(Boolean).join(' · ') });
    });
    return h('div', { class: 'alert warn' },
      h('strong', { text: error.code === 'DUPLICATE_USER' ? t('dupUser') : t('dupFound') }),
      h('ul', null, list),
      error.code === 'DUPLICATE' ? h('div', { style: 'margin-top:10px' }, h('button', { class: 'btn small', type: 'button', text: t('dupConfirm'), onclick: onConfirm })) : null);
  }

  /** Short form: essentials first, everything else behind "More details". */
  function openForm(options) {
    var entity = options.entity;
    var meta = formMeta(entity);
    var ui = ENTITY_UI[entity];
    var record = options.record || {};
    var isEdit = !!options.record;
    var defaults = {};
    if (!isEdit) meta.fields.forEach(function (field) { if (field.defaultValue !== null && field.defaultValue !== undefined) defaults[field.name] = field.defaultValue; });
    if (!isEdit && entity === 'FollowUps' && !defaults.DueDate) defaults.DueDate = state.today;
    if (!isEdit && (entity === 'FollowUps' || entity === 'Leads') && state.boot.restricted && !(options.presets || {}).AssignedTo) defaults.AssignedTo = state.boot.userId;
    var values = Object.assign(defaults, record, options.presets || {});
    var labels = Object.assign({}, options.labels || {});
    var alertBox = h('div');
    var grid = h('div', { class: 'form-grid' });
    var extra = h('div', { class: 'form-grid', style: 'grid-column:1/-1', hidden: !options.expanded });
    var controls = {};
    var holders = {};
    var essentials = ui.essentials || meta.fields.map(function (field) { return field.name; });
    var presetKeys = Object.keys(options.presets || {});
    function isEssential(field) {
      return field.required || essentials.indexOf(field.name) !== -1 || presetKeys.indexOf(field.name) !== -1 || (isEdit && !blank(record[field.name]));
    }
    var ordered = meta.fields.slice().sort(function (a, b) {
      var ia = essentials.indexOf(a.name); var ib = essentials.indexOf(b.name);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
    var hiddenCount = 0;
    function refreshConditions() {
      Object.keys(SHOW_IF).forEach(function (name) {
        if (!holders[name]) return;
        var current = {};
        Object.keys(controls).forEach(function (key) { current[key] = controls[key].getValue(); });
        holders[name].hidden = !SHOW_IF[name](current);
      });
    }
    ordered.forEach(function (field) {
      var holder = h('div', { class: 'form-field' + (field.type === 'longtext' ? ' wide' : '') });
      holder.appendChild(h('label', null, fieldLabel(field.name), field.required ? h('span', { class: 'req', text: ' *' }) : null));
      if (field.type === 'entityReference') {
        var picker = pickerControl(DOC_TARGETS[values.EntityType], values.EntityID, labels[values.EntityID]);
        controls[field.name] = picker;
        holder.appendChild(picker.el);
      } else {
        var onChange = field.name === 'ClientType' ? refreshConditions : field.name === 'EntityType' ? function () {
          var replacement = pickerControl(DOC_TARGETS[controls.EntityType.getValue()], '', '');
          holders.EntityID.replaceChild(replacement.el, controls.EntityID.el);
          controls.EntityID = replacement;
        } : null;
        var control = buildControl(entity, field, values, labels, onChange, isEdit && field.lockedOnEdit);
        controls[field.name] = control;
        holder.appendChild(control.el);
      }
      holders[field.name] = holder;
      if (isEssential(field) || options.expanded) grid.appendChild(holder);
      else { extra.appendChild(holder); hiddenCount += 1; }
    });
    if (hiddenCount && !options.expanded) {
      var toggle = h('button', { class: 'more-toggle', type: 'button' }, icon('down'), t('moreDetails', { n: hiddenCount }));
      toggle.addEventListener('click', function () { extra.hidden = !extra.hidden; toggle.classList.toggle('open', !extra.hidden); });
      grid.appendChild(toggle);
      grid.appendChild(extra);
    }
    refreshConditions();

    var save = h('button', { class: 'btn primary', type: 'button', text: isEdit ? t('saveChanges') : t('create') });
    function collect() {
      var payload = {};
      var missing = [];
      meta.fields.forEach(function (field) {
        if (holders[field.name] && holders[field.name].hidden && SHOW_IF[field.name]) return;
        var value = controls[field.name].getValue();
        if (field.required && blank(value)) missing.push(fieldLabel(field.name));
        if (isEdit) { if (!field.lockedOnEdit && comparable(field, value) !== comparable(field, record[field.name])) payload[field.name] = value; }
        else if (!blank(value)) payload[field.name] = value;
      });
      return { payload: payload, missing: missing };
    }
    function submit(confirmDuplicate) {
      var collected = collect();
      clear(alertBox);
      if (collected.missing.length) { alertBox.appendChild(h('div', { class: 'alert danger', text: t('requiredFields', { x: collected.missing.join(state.lang === 'ar' ? '، ' : ', ') }) })); return; }
      if (isEdit && !Object.keys(collected.payload).length) { closeModal(); return; }
      if (confirmDuplicate) collected.payload.confirmDuplicate = true;
      save.disabled = true;
      var request = isEdit ? call('apiUpdate', entity, recordId(entity, record), collected.payload, record.Version) : call('apiCreate', entity, collected.payload);
      request.then(function (saved) {
        closeModal();
        toast(t(isEdit ? 'updatedToast' : 'createdToast', { x: entitySingular(entity) }));
        if (options.onSaved) options.onSaved(saved);
      }).catch(function (error) {
        save.disabled = false;
        if (error.code === 'DUPLICATE' || error.code === 'DUPLICATE_USER') alertBox.appendChild(duplicateAlert(error, function () { submit(true); }));
        else alertBox.appendChild(h('div', { class: 'alert danger', text: errorMessage(error) }));
        $('modal-body').scrollTop = 0;
      });
    }
    save.addEventListener('click', function () { submit(false); });
    grid.addEventListener('keydown', function (event) { if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) submit(false); });
    openModal(t(isEdit ? 'editTitle' : 'newTitle', { x: lower(entitySingular(entity)) }), [alertBox, grid],
      [h('button', { class: 'btn ghost', type: 'button', text: t('cancel'), onclick: closeModal }), save]);
  }

  function openConvert(lead) {
    var alertBox = h('div');
    var fields = ['Email', 'Phone', 'Address', 'Nationality'];
    var inputs = {};
    var grid = h('div', { class: 'form-grid' }, fields.map(function (field) {
      var input = field === 'Address' ? h('textarea', { class: 'input', dir: 'auto' }) : h('input', { class: 'input', type: field === 'Email' ? 'email' : field === 'Phone' ? 'tel' : 'text', dir: field === 'Email' || field === 'Phone' ? 'ltr' : 'auto' });
      input.value = lead[field] || '';
      inputs[field] = input;
      return h('div', { class: 'form-field' + (field === 'Address' ? ' wide' : '') }, h('label', { text: fieldLabel(field) }), input);
    }));
    var intro = h('p', { class: 'muted', style: 'margin-top:0' }, h('strong', { dir: 'auto', style: 'color:var(--text)', text: lead.FullName }), t('convertIntroAfter'));
    var button = h('button', { class: 'btn gold', type: 'button', text: t('convert') });
    function submit(confirmDuplicate) {
      var input = {};
      fields.forEach(function (field) { var v = inputs[field].value.trim(); if (v) input[field] = v; });
      if (confirmDuplicate) input.confirmDuplicate = true;
      clear(alertBox);
      button.disabled = true;
      call('apiConvertLead', lead.LeadID, lead.Version, input).then(function (result) {
        closeModal();
        toast(t('convertedToast'));
        navigate({ view: 'detail', entity: 'Clients', id: result.client.ClientID });
      }).catch(function (error) {
        button.disabled = false;
        if (error.code === 'DUPLICATE') alertBox.appendChild(duplicateAlert(error, function () { submit(true); }));
        else alertBox.appendChild(h('div', { class: 'alert danger', text: errorMessage(error) }));
      });
    }
    button.addEventListener('click', function () { submit(false); });
    openModal(t('convertTitle'), [alertBox, intro, grid], [h('button', { class: 'btn ghost', type: 'button', text: t('cancel'), onclick: closeModal }), button]);
  }

  // ------------------------------------------------------------ Documents
  function base64ToBytes(base64) {
    var binary = atob(base64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }
  function downloadDocument(record) {
    toast(t('downloading'));
    call('apiDownloadDocument', record.DocumentID).then(function (file) {
      var url = URL.createObjectURL(new Blob([base64ToBytes(file.base64)], { type: file.mimeType || 'application/octet-stream' }));
      var link = h('a', { href: url, download: file.fileName, style: 'display:none' });
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    }).catch(function (error) { toast(errorMessage(error), true); });
  }

  /** Drag-and-drop (or browse) upload; the server keeps the file in the private documents folder. */
  function openUpload(options) {
    options = options || {};
    var presets = options.presets || {};
    var labels = options.labels || {};
    var limits = state.boot.upload;
    var mb = Math.round(limits.maxBytes / 1048576);
    var alertBox = h('div');
    var chosen = null;
    var fileInput = h('input', { type: 'file', hidden: true, accept: limits.extensions.map(function (ext) { return '.' + ext; }).join(',') });
    var fileName = h('div', { class: 'file-name', dir: 'auto' });
    var drop = h('div', { class: 'dropzone', role: 'button', tabindex: '0' }, h('div', { class: 'tile-icon meet' }, icon('upload')),
      h('div', { style: 'font-weight:500', text: t('dropHere') }), h('div', { class: 'faint', style: 'font-size:12.5px;margin-top:4px', text: t('fileHelp', { mb: mb }) }), fileName, fileInput);
    function choose(file) {
      clear(alertBox);
      if (!file) return;
      var ext = (file.name.match(/\.([A-Za-z0-9]+)$/) || [])[1];
      if (!ext || limits.extensions.indexOf(ext.toLowerCase()) === -1) { chosen = null; fileName.textContent = ''; return fail(t('badType')); }
      if (file.size > limits.maxBytes) { chosen = null; fileName.textContent = ''; return fail(t('tooLarge', { mb: mb })); }
      chosen = file;
      fileName.textContent = file.name;
    }
    drop.addEventListener('click', function () { fileInput.click(); });
    drop.addEventListener('keydown', function (event) { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); fileInput.click(); } });
    fileInput.addEventListener('change', function () { choose(fileInput.files && fileInput.files[0]); });
    ['dragenter', 'dragover'].forEach(function (name) { drop.addEventListener(name, function (event) { event.preventDefault(); drop.classList.add('over'); }); });
    ['dragleave', 'drop'].forEach(function (name) { drop.addEventListener(name, function (event) { event.preventDefault(); drop.classList.remove('over'); }); });
    drop.addEventListener('drop', function (event) { choose(event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0]); });

    var grid = h('div', { class: 'form-grid' }, h('div', { class: 'form-field wide' }, drop));
    var typeControl = null;
    var picker = null;
    if (presets.EntityType && presets.EntityID) {
      grid.appendChild(h('div', { class: 'form-field wide' }, h('label', { text: t('attachTo') }),
        h('div', { class: 'picker-selected' }, h('input', { class: 'input', readonly: true, dir: 'auto', value: entitySingular(DOC_TARGETS[presets.EntityType]) + ' · ' + (labels[presets.EntityID] || presets.EntityID) }))));
    } else {
      typeControl = h('select', { class: 'input' }, h('option', { value: '', text: t('choose') }), Object.keys(DOC_TARGETS).map(function (key) { return h('option', { value: key, text: enumLabel(key) }); }));
      var pickerHolder = h('div', { class: 'form-field' }, h('label', null, t('whichOne'), h('span', { class: 'req', text: ' *' })));
      picker = pickerControl(null, '', '');
      pickerHolder.appendChild(picker.el);
      typeControl.addEventListener('change', function () {
        var replacement = pickerControl(DOC_TARGETS[typeControl.value], '', '');
        pickerHolder.replaceChild(replacement.el, picker.el);
        picker = replacement;
      });
      grid.appendChild(h('div', { class: 'form-field' }, h('label', null, t('attachTo'), h('span', { class: 'req', text: ' *' })), typeControl));
      grid.appendChild(pickerHolder);
    }
    var levels = (fieldMeta('Documents', 'ConfidentialityLevel') || { options: ['STANDARD'] }).options;
    var level = h('select', { class: 'input' }, levels.map(function (option) { return h('option', { value: option, text: enumLabel(option), selected: option === (levels.indexOf('CONFIDENTIAL') !== -1 ? 'CONFIDENTIAL' : levels[0]) }); }));
    grid.appendChild(h('div', { class: 'form-field' }, h('label', { text: fieldLabel('ConfidentialityLevel') }), level));
    var description = h('input', { class: 'input', dir: 'auto', placeholder: t('optional') });
    grid.appendChild(h('div', { class: 'form-field' }, h('label', { text: fieldLabel('Description') }), description));

    var button = h('button', { class: 'btn primary', type: 'button' }, icon('upload'), t('upload'));
    function fail(message) { clear(alertBox).appendChild(h('div', { class: 'alert danger', text: message })); }
    button.addEventListener('click', function () {
      if (!chosen) return fail(t('chooseFileFirst'));
      var meta = { ConfidentialityLevel: level.value, Description: description.value.trim() };
      meta.EntityType = presets.EntityType || (typeControl && typeControl.value);
      meta.EntityID = presets.EntityID || (picker && picker.getValue());
      if (!meta.EntityType || !meta.EntityID) return fail(t('requiredFields', { x: t('attachTo') }));
      button.disabled = true;
      var reader = new FileReader();
      reader.onerror = function () { button.disabled = false; fail(t('somethingWrong')); };
      reader.onload = function () {
        call('apiUploadDocument', meta, { name: chosen.name, base64: String(reader.result).split(',')[1] || '' }).then(function (saved) {
          closeModal();
          toast(t('uploadedToast'));
          if (options.onSaved) options.onSaved(saved);
        }).catch(function (error) { button.disabled = false; fail(errorMessage(error)); });
      };
      reader.readAsDataURL(chosen);
    });
    openModal(t('uploadDocument'), [alertBox, grid], [h('button', { class: 'btn ghost', type: 'button', text: t('cancel'), onclick: closeModal }), button]);
  }

  // ------------------------------------------------------------ Settings
  function showSettings() {
    var root = content();
    root.appendChild(pageHead(t('navSettings'), t('settingsSub')));
    var grid = h('div', { class: 'settings-grid' });
    root.appendChild(grid);

    // Personal preferences — everyone.
    var langRow = h('div', { class: 'lang-choice' });
    [['EN', 'English'], ['AR', 'العربية']].forEach(function (pair) {
      langRow.appendChild(h('button', { class: 'btn' + (state.lang === pair[0].toLowerCase() ? ' on' : ''), type: 'button', text: pair[1], onclick: function () { setLanguage(pair[0]); } }));
    });
    grid.appendChild(h('div', { class: 'card' }, h('div', { class: 'card-title', text: t('yourPreferences') }),
      h('div', { class: 'fact-label', text: t('language') }), langRow,
      h('div', { class: 'fact-label', style: 'margin-top:16px', text: t('remindersTitle') }),
      h('p', { text: t('reminderPersonal') }),
      h('button', { class: 'btn small', type: 'button', onclick: previewReminder }, icon('mail'), t('previewReminder'))));

    // Owner reminder switch.
    if (can('Settings', 'update')) {
      var reminderCard = h('div', { class: 'card' }, h('div', { class: 'card-title' }, icon('bell'), t('remindersTitle')), h('p', { text: t('remindersNote') }));
      var switchRow = h('label', { class: 'switch' });
      var status = h('span', { class: 'muted', text: t('loading') });
      var input = h('input', { type: 'checkbox', disabled: true });
      switchRow.appendChild(input);
      switchRow.appendChild(status);
      reminderCard.appendChild(switchRow);
      reminderCard.appendChild(h('button', { class: 'btn small', type: 'button', style: 'margin-top:10px', onclick: function () {
        call('apiSendRemindersNow').then(function (result) { toast(t('sentN', { n: result.sent })); }).catch(function (error) { toast(errorMessage(error), true); });
      } }, t('sendNow')));
      var drawStatus = function (info) { input.disabled = false; input.checked = info.enabled; status.textContent = info.enabled ? t('remindersOn', { h: info.hour }) : t('remindersOff'); };
      input.addEventListener('change', function () {
        input.disabled = true;
        call('apiSetDailyReminders', input.checked).then(drawStatus).catch(function (error) { input.checked = !input.checked; input.disabled = false; toast(errorMessage(error), true); });
      });
      call('apiGetReminderStatus').then(drawStatus).catch(function (error) { status.textContent = errorMessage(error); });
      grid.appendChild(reminderCard);
    }

    var firmHolder = h('div', { class: 'card', style: 'grid-column:1/-1' }, h('div', { class: 'loading', text: t('loading') }));
    grid.appendChild(firmHolder);
    call('apiGetSettings').then(function (settings) {
      clear(firmHolder);
      var editable = can('Settings', 'update');
      var byKey = {};
      settings.forEach(function (setting) { byKey[setting.key] = setting; });
      firmHolder.appendChild(h('div', { class: 'card-title', text: t('firmSettings') }));
      var form = h('div', { class: 'form-grid' });
      var saveSetting = function (key, value, button) {
        button.disabled = true;
        call('apiUpdateSetting', key, value, byKey[key].version).then(function () {
          toast(t('settingSaved'));
          return call('apiGetAppBootstrap').then(function (boot) { state.boot = boot; showSettings(); });
        }).catch(function (error) { button.disabled = false; toast(errorMessage(error), true); });
      };
      if (byKey.BUSINESS_NAME) {
        var nameInput = h('input', { class: 'input', value: byKey.BUSINESS_NAME.value, dir: 'auto', disabled: !editable });
        var nameSave = h('button', { class: 'btn small', type: 'button', text: t('save'), hidden: !editable, onclick: function () { saveSetting('BUSINESS_NAME', nameInput.value.trim(), nameSave); } });
        form.appendChild(h('div', { class: 'form-field' }, h('label', { text: settingLabel('BUSINESS_NAME') }), h('div', { class: 'team-add', style: 'margin:0' }, nameInput, nameSave)));
      }
      if (byKey.NOTIFICATION_PREFERENCES) {
        var prefs = byKey.NOTIFICATION_PREFERENCES.value || {};
        var boxes = {};
        var prefHolder = h('div', { class: 'form-field' }, h('label', { text: settingLabel('NOTIFICATION_PREFERENCES') }));
        Object.keys(prefs).forEach(function (key) {
          boxes[key] = h('input', { type: 'checkbox', checked: prefs[key] === true, disabled: !editable });
          boxes[key].addEventListener('change', function () {
            var next = {};
            Object.keys(boxes).forEach(function (name) { next[name] = boxes[name].checked; });
            saveSetting('NOTIFICATION_PREFERENCES', next, boxes[key]);
          });
          prefHolder.appendChild(h('label', { class: 'switch' }, boxes[key], h('span', { text: settingLabel(key) })));
        });
        form.appendChild(prefHolder);
      }
      if (byKey.PRACTICE_AREAS) {
        var area = h('textarea', { class: 'input', dir: 'ltr', disabled: !editable });
        area.value = (byKey.PRACTICE_AREAS.value || []).join('\n');
        var areaSave = h('button', { class: 'btn small', type: 'button', style: 'margin-top:8px', text: t('save'), hidden: !editable, onclick: function () {
          saveSetting('PRACTICE_AREAS', area.value.split('\n').map(function (line) { return line.trim(); }).filter(Boolean), areaSave);
        } });
        form.appendChild(h('div', { class: 'form-field wide' }, h('label', { text: settingLabel('PRACTICE_AREAS') }),
          h('div', { class: 'faint', style: 'font-size:12.5px;margin-bottom:6px', text: t('practiceHelp') }), area, areaSave));
      }
      firmHolder.appendChild(form);
      var fixed = settings.filter(function (setting) { return !setting.editable || setting.key === 'FUTURE_INTEGRATIONS_ENABLED'; });
      if (fixed.length) {
        var list = h('dl', { class: 'kv' });
        fixed.forEach(function (setting) {
          var value = setting.value;
          var shown = Array.isArray(value) ? value.map(enumLabel).join(state.lang === 'ar' ? '، ' : ', ') : typeof value === 'boolean' ? (value ? t('yes') : t('no')) : String(value);
          list.appendChild(h('dt', { text: settingLabel(setting.key) }));
          list.appendChild(h('dd', { dir: 'auto', text: shown }));
        });
        firmHolder.appendChild(h('details', { class: 'system' }, h('summary', { text: t('systemValues') }), list));
      }
    }).catch(function (error) { clear(firmHolder).appendChild(h('div', { class: 'alert danger', text: errorMessage(error) })); });
  }

  function previewReminder() {
    call('apiPreviewMyReminder').then(function (digest) {
      openModal(t('previewReminder'), digest
        ? [h('div', { class: 'fact-label', dir: 'auto', style: 'margin-bottom:8px', text: digest.subject }), h('pre', { class: 'digest', dir: digest.language === 'AR' ? 'rtl' : 'ltr', text: digest.text })]
        : emptyState('sun', t('allClear'), t('nothingForYou')),
        [h('button', { class: 'btn primary', type: 'button', text: t('close'), onclick: closeModal })]);
    }).catch(function (error) { toast(errorMessage(error), true); });
  }

  function setLanguage(code) {
    applyLanguage(code);
    if (state.current) render();
    call('apiSetMyLanguage', code).catch(function (error) { toast(errorMessage(error), true); });
  }

  // ------------------------------------------------------------ Startup
  $('modal-close').appendChild(icon('x'));
  $('menu-toggle').appendChild(icon('menu'));
  $('modal-close').addEventListener('click', closeModal);
  $('modal-backdrop').addEventListener('click', function (event) { if (event.target === $('modal-backdrop')) closeModal(); });
  document.addEventListener('keydown', function (event) { if (event.key === 'Escape') { if (!$('modal-backdrop').hidden) closeModal(); closeMenus(); } });
  document.addEventListener('click', closeMenus);
  $('menu-toggle').addEventListener('click', openDrawer);
  $('scrim').addEventListener('click', closeDrawer);
  $('lang-toggle').addEventListener('click', function () { setLanguage(state.lang === 'ar' ? 'EN' : 'AR'); });
  window.addEventListener('scroll', function () { document.querySelector('.topbar').classList.toggle('scrolled', window.scrollY > 4); });
  setupSearch();

  call('apiGetAppBootstrap').then(function (boot) {
    state.boot = boot;
    applyLanguage(boot.language);
    // window.__MP_START__ is only ever set by tools/preview-server.js.
    var start = window.__MP_START__ || null;
    navigate(start && start.route ? start.route : { view: 'home' }, true);
    if (start && start.form) openForm({ entity: start.form, record: start.record || null, labels: {} });
    if (start && start.convert) openConvert(start.convert);
    if (start && start.upload) openUpload({});
  }).catch(function (error) {
    content();
    showError(error);
  });
})();
</script>
